
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscription Platform - Test Checkout</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 5px;
    }
    button {
      margin-top: 22px;
      padding: 12px 18px;
      cursor: pointer;
    }
    #result { margin-top: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>Subscription Checkout</h2>
  <p>Development testing only — Razorpay Test Mode.</p>

  <label for="productKey">Product API Key</label>
  <input id="productKey" type="password" autocomplete="off"
         placeholder="Enter the raw x-product-key value" required />

  <label for="internalOrderId">Internal Order ID</label>
  <input id="internalOrderId"
         value="ba2fb856-94d0-4c33-bfb0-6eff723d6528" required />

  <label for="razorpayOrderId">Razorpay Order ID</label>
  <input id="razorpayOrderId" value="order_ToUpn6l4fRfLP0" required />

  <label for="keyId">Razorpay Test Key ID</label>
  <input id="keyId" value="rzp_test_Tllay0EYnoBn5e" required />

  <p><strong>Plan:</strong> PRO · ₹599 · 90 days</p>

  <button id="payButton" type="button">Pay ₹599 (Test Mode)</button>
  <div id="result" role="status"></div>

  <script>
    const result = document.getElementById('result');
    const payButton = document.getElementById('payButton');

    payButton.addEventListener('click', async () => {
      result.textContent = '';

      const productKey =
        document.getElementById('productKey').value.trim();
      const internalOrderId =
        document.getElementById('internalOrderId').value.trim();
      const razorpayOrderId =
        document.getElementById('razorpayOrderId').value.trim();
      const keyId = document.getElementById('keyId').value.trim();

      if (!productKey || !internalOrderId || !razorpayOrderId || !keyId) {
        result.textContent = 'Please fill in all fields.';
        return;
      }

      if (!window.Razorpay) {
        result.textContent =
          'Razorpay Checkout did not load. Check the network and browser console.';
        return;
      }

      payButton.disabled = true;
      result.textContent = 'Opening Razorpay Checkout...';

      try {
        const options = {
          key: keyId,
          amount: 59900,
          currency: 'INR',
          name: 'Common Subscription Platform',
          description: 'PRO subscription - 90 days',
          order_id: razorpayOrderId,
          handler: async function (response) {
            result.textContent = 'Payment returned. Verifying with server...';

            try {
              const verification = await fetch(
                '/api/payments/verify',
                {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'x-product-key': productKey
                  },
                  body: JSON.stringify({
                    orderId: internalOrderId,
                    razorpayOrderId: response.razorpay_order_id,
                    razorpayPaymentId: response.razorpay_payment_id,
                    razorpaySignature: response.razorpay_signature
                  })
                }
              );

              const data = await verification.json();

              result.textContent =
                `Verification HTTP status: ${verification.status}\n` +
                JSON.stringify(data, null, 2);
            } catch (error) {
              result.textContent =
                'Could not reach the verification endpoint: ' +
                error.message;
            } finally {
              payButton.disabled = false;
            }
          },
          modal: {
            ondismiss: function () {
              result.textContent =
                'Checkout closed. Confirm payment status before retrying.';
              payButton.disabled = false;
            }
          },
          theme: {
            color: '#2563eb'
          }
        };

        const checkout = new Razorpay(options);

        checkout.on('payment.failed', function (response) {
          result.textContent =
            'Payment failed:\n' +
            JSON.stringify(response.error, null, 2);
          payButton.disabled = false;
        });

        checkout.open();
      } catch (error) {
        result.textContent = 'Checkout error: ' + error.message;
        payButton.disabled = false;
      }
    });
  </script>
</body>
</html>
